repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^(include|test|examples)/.*\.(hpp|cpp)$

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        language: system
        files: ^(include|test|examples)/.*\.(hpp|cpp)$
        pass_filenames: false
        entry: bash -c 'CC=clang-18 CXX=clang++-18 cmake -S . -B build/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON -DBUILD_BENCHMARKS=ON >/dev/null && clang-tidy-18 -p build/tidy test/*.cpp examples/robot_example.cpp examples/minimal_composition.cpp'
